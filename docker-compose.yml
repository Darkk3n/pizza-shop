services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: pizzashop-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pizzashop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  # Local email catcher: the API sends confirmation and reset emails to its SMTP port (1025, see
  # Email:Smtp in api/appsettings.json) and they show up in the inbox at http://localhost:8025.
  # Nothing is delivered to real addresses.
  mailpit:
    image: docker.io/axllent/mailpit:v1.31.4
    container_name: pizzashop-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
